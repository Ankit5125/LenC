<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <title>LenC</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="34" height="34">
      <div>
        <h1>LenC</h1>
        <p>Reverse image search in one click</p>
      </div>
    </div>
    <button id="openOptions" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="block">
    <div class="label">Search with</div>
    <div id="chips" class="chips" role="radiogroup" aria-label="Search engine"></div>
  </section>

  <section class="block actions">
    <button class="primary" data-action="start-area">
      <span class="marquee" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="txt"><b>Select an area</b><small>Drag over any part of the page</small></span>
      <kbd data-cmd="select-area"></kbd>
    </button>
    <div class="pair">
      <button class="secondary" data-action="search-visible">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        <span class="txt"><b>Visible page</b><small>What's on screen</small></span>
      </button>
      <button class="secondary" data-action="search-fullpage">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M10 7h4M10 11h4M10 15h2"/></svg>
        <span class="txt"><b>Full page</b><small>Scroll and stitch</small></span>
      </button>
    </div>
  </section>

  <section class="block">
    <div class="label">Or search an image you already have</div>
    <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose, drop or paste an image">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span>Drop, paste (Ctrl+V) or click to choose</span>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <form id="urlForm" class="url">
      <input id="urlInput" type="text" inputmode="url" placeholder="Paste an image address" autocomplete="off" spellcheck="false">
      <button type="submit">Search</button>
    </form>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
